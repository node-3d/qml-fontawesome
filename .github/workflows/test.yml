name: Test
defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  package:
    name: Pack npm Candidate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Store npm Candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ci

  consumer-tests:
    name: Packed Consumer (${{ matrix.target }})
    needs: [package, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            node_arch: arm64
          - target: darwin-x64
            os: macos-26-intel
            node_arch: x64
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
      - name: Install Qt Runtime Libraries - Linux
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq libgles2-mesa-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
          sudo apt-get install -qq libdbus-1-3 libxcb-image0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0
      - uses: ssciwr/setup-mesa-dist-win@v3
        if: matrix.target == 'windows-x64'
      - name: Install Packed Consumer Candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          package-name: '@node-3d/qml-fontawesome'
          fixture: test-consumer
      - name: Run Packed Consumer Tests - Linux
        if: startsWith(matrix.target, 'linux-')
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: |
          if [ '${{ matrix.target }}' = 'linux-arm64' ]; then
            export QT_XCB_GL_INTEGRATION=xcb_egl
          fi
          QT_QPA_PLATFORM=xcb xvfb-run --auto-servernum npm test
      - name: Run Packed Consumer Tests - Windows and macOS
        if: startsWith(matrix.target, 'windows-') || startsWith(matrix.target, 'darwin-')
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm test
